    <title>ANIMO</title>
    <style>
      /* Écran de démarrage : visible avant même le chargement de l'app */
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-content: center; justify-items: center; gap: 20px;
        padding-bottom: 6vh; background: #fbf7f4;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #splash.is-hidden { opacity: 0; visibility: hidden; }
      .splash-mark { width: 112px; height: auto; animation: splash-bob 1.6s ease-in-out infinite; }
      .splash-shadow {
        width: 76px; height: 10px; margin-top: -14px; border-radius: 50%; background: #5b3a6e;
        opacity: 0.12; animation: splash-shadow 1.6s ease-in-out infinite;
      }
      .splash-word {
        font-family: 'Zen Maru Gothic', 'Nunito', system-ui, sans-serif; font-weight: 900;
        font-size: 34px; line-height: 1; letter-spacing: 0.14em; padding-left: 0.14em; color: #2a1e2e;
      }
      .splash-word span { color: #e0457b; }
      @keyframes splash-bob { 50% { transform: translateY(-9px); } }
      @keyframes splash-shadow { 50% { transform: scaleX(0.82); opacity: 0.07; } }
      @media (prefers-color-scheme: dark) {
        #splash { background: #17111c; }
        .splash-word { color: #f6eef3; }
        .splash-word span { color: #ff6f9c; }
        .splash-shadow { background: #000; opacity: 0.35; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark, .splash-shadow { animation: none; }
      }
    </style>
  </head>

    <div id="splash" aria-hidden="true">

      </svg>
